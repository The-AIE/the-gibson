name: Lesson ledger freshness
# Report-only ledger freshness and prose-only debt (#571). Schedule and
# manual dispatch only: this is not a merge check and it does not block merges.
# A completed RED verdict exits 0. UNKNOWN exits 1. fetch-depth 0 because a
# shallow clone cannot tell intake from a quiet history and must not look healthy.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson-ledger-freshness
  cancel-in-progress: false
jobs:
  lesson-ledger-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Report lesson ledger freshness
        run: |
          set -euo pipefail
          node scripts/lesson-ledger-freshness.mjs --root . | tee "$GITHUB_STEP_SUMMARY"
