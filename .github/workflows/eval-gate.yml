name: gibson-eval-gate
# Opt-in eval gate (docs/eval-layer.md, #583). Never a required check. Fail-closed; no
# continue-on-error / || true / set +e.
#
# Two ways it runs:
#   * workflow_dispatch with a `runner`: runs the real dataset (evals/dataset.v1.jsonl)
#     against your runner command and gates on the pass rate. This is the opt-in use.
#   * weekly schedule, or workflow_dispatch with an empty `runner`: a deterministic SMOKE
#     run of the eval layer itself. It echoes a fixed 3-case dataset (evals/smoke.v1.jsonl)
#     through `jq`, so there are no model calls, no spend and no secrets. It exists so this
#     standing workflow has a recent green scheduled run and stays truthful in sensor-health.
#     sensor-health watches the `schedule` event only: a manual run that misses its
#     threshold fails by design and must not turn the standing sensor red.
#
# Langfuse shipping is optional and only the real run gets the keys: set repo secrets
# LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (and LANGFUSE_HOST for non-cloud).
on:
  schedule:
    - cron: "23 13 * * 2"
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant name (letters, digits, . _ -)"
        required: true
        default: "ci"
      runner:
        description: "Runner command (reads a case as JSON on stdin, prints the answer). Empty = smoke run."
        required: false
        default: ""
      grader:
        description: "Optional grader command (JSON verdict on stdout). Empty = expect-only."
        required: false
        default: ""
      ledger:
        description: "Optional cost-ledger JSONL path in the repo to send as traces"
        required: false
        default: ""
      min_pass_rate:
        description: "Minimum pass rate, 0 to 1"
        required: true
        default: "0.8"
# Deny all by default. Jobs grant least privilege only.
permissions: {}

# A manual eval run must not cancel a sibling run.
concurrency:
  group: eval-gate
  cancel-in-progress: false
jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Smoke run (deterministic, no model calls, no secrets)
        if: ${{ github.event_name == 'schedule' || inputs.runner == '' }}
        run: |
          set -euo pipefail
          node scripts/eval-dataset-lint.mjs --file evals/smoke.v1.jsonl --min 1 --max 10
          node scripts/eval-run.mjs --variant smoke --runner "jq -rj .input" --dataset evals/smoke.v1.jsonl
          node scripts/eval-gate.mjs --variant smoke --min-pass-rate 1 --dataset evals/smoke.v1.jsonl
      - name: Lint the dataset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner != '' }}
        run: node scripts/eval-dataset-lint.mjs
      - name: Run the dataset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner != '' }}
        env:
          VARIANT: ${{ inputs.variant }}
          RUNNER: ${{ inputs.runner }}
          GRADER: ${{ inputs.grader }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          set -euo pipefail
          if [ -n "$GRADER" ]; then
            node scripts/eval-run.mjs --variant "$VARIANT" --runner "$RUNNER" --grader "$GRADER"
          else
            node scripts/eval-run.mjs --variant "$VARIANT" --runner "$RUNNER"
          fi
      - name: Gate on pass rate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner != '' }}
        env:
          VARIANT: ${{ inputs.variant }}
          MIN: ${{ inputs.min_pass_rate }}
        run: node scripts/eval-gate.mjs --variant "$VARIANT" --min-pass-rate "$MIN"
      - name: Send the cost ledger as traces (only when a ledger path was given)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner != '' && inputs.ledger != '' }}
        env:
          LEDGER: ${{ inputs.ledger }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: node scripts/eval-trace.mjs --ledger "$LEDGER" --all
