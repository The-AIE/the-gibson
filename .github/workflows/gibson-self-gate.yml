# Gibson's own green gate (#89).
#
# ci/gibson-gate.yml is the template we hand to *target* repos; this is the one
# that guards this repo. Without it, thirteen sensor suites only ran when a human
# remembered to type them, and four of them were red on main (#90).
name: gibson-self-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Exact ShellCheck pin — must match SHELLCHECK_REQUIRED_VERSION in
      # scripts/tests/run-all.sh. Unpinned apt shellcheck on ubuntu-latest has
      # been 0.9.x/0.10.x and reports different findings than the baseline
      # ratchet (issue #138 / PR #142). Architecture: ubuntu-latest → linux
      # x86_64 (GitHub-hosted runners as of this pin).
      - name: Install ShellCheck 0.11.0 (official release, pinned SHA-256)
        env:
          SC_VERSION: "0.11.0"
          # Official digest from the GitHub release asset metadata for
          # shellcheck-v0.11.0.linux.x86_64.tar.xz (also verified by downloading
          # the asset and computing SHA-256 locally).
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SC_URL: "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
        run: |
          set -euo pipefail
          # This pin is the official linux.x86_64 asset only. Refuse other
          # architectures so we never silently install a binary that cannot run.
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "error: ShellCheck pin is shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
            echo "       This runner reports uname -m = '${arch}'."
            echo "       Refusing to install the wrong binary. Use an x86_64 runner"
            echo "       or extend the pin with a matching official asset + digest."
            exit 1
          fi
          cd "${RUNNER_TEMP}"
          curl -fsSL -o "shellcheck.tar.xz" "$SC_URL"
          echo "${SC_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          test "$(shellcheck --version | awk '/^version:/{print $2}')" = "$SC_VERSION"

      # The claim suites commit into throwaway repos and a runner has no global
      # git identity, so without this they fail 24 assertions for a reason that
      # has nothing to do with the code (#101 tracks making them hermetic).
      - name: Test git identity
        run: |
          echo "GIT_AUTHOR_NAME=gibson-ci"            >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=ci@gibson.invalid"   >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_NAME=gibson-ci"         >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_EMAIL=ci@gibson.invalid" >> "$GITHUB_ENV"

      # Docker is present on ubuntu-latest, so run-all.sh also checks that every
      # script parses under bash 3.2 — stock macOS, where most of our
      # portability lessons were earned.
      - name: Run every sensor
        run: ./scripts/tests/run-all.sh

      # Advisory: the burn-down view. Shows what the quarantine is hiding
      # without failing the build, so the list stays visible instead of
      # becoming furniture.
      - name: Quarantine burn-down (advisory)
        if: always()
        continue-on-error: true
        run: |
          echo "### Quarantined suites" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/tests/run-all.sh --list-quarantine >> "$GITHUB_STEP_SUMMARY"

  claim-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: A PR may not edit another session's claim
        run: node scripts/check-active-work.mjs
