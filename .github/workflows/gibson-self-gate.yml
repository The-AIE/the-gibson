# Gibson's own green gate (#89).
#
# ci/gibson-gate.yml is the template we hand to *target* repos; this is the one
# that guards this repo. Without it, thirteen sensor suites only ran when a human
# remembered to type them, and four of them were red on main (#90).
name: gibson-self-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # The claim suites commit into throwaway repos and a runner has no global
      # git identity, so without this they fail 24 assertions for a reason that
      # has nothing to do with the code (#101 tracks making them hermetic).
      - name: Test git identity
        run: |
          echo "GIT_AUTHOR_NAME=gibson-ci"            >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=ci@gibson.invalid"   >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_NAME=gibson-ci"         >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_EMAIL=ci@gibson.invalid" >> "$GITHUB_ENV"

      # Docker is present on ubuntu-latest, so run-all.sh also checks that every
      # script parses under bash 3.2 — stock macOS, where most of our
      # portability lessons were earned.
      - name: Run every sensor
        run: ./scripts/tests/run-all.sh

      # Advisory: the burn-down view. Shows what the quarantine is hiding
      # without failing the build, so the list stays visible instead of
      # becoming furniture.
      - name: Quarantine burn-down (advisory)
        if: always()
        continue-on-error: true
        run: |
          echo "### Quarantined suites" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/tests/run-all.sh --list-quarantine >> "$GITHUB_STEP_SUMMARY"

  claim-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: A PR may not edit another session's claim
        run: node scripts/check-active-work.mjs
