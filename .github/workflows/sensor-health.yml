name: Sensor health
# Daily sensor-health (#210/#256). Fail-closed; no continue-on-error / || true / set +e. Updates #212 by number only.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sensor-health
  cancel-in-progress: false
jobs:
  sensor-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Audit sensors and upsert report issue #212
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sensor-health.mjs --post
      - name: Self-gate false-red and feedback-time budgets (config/self-gate-health.v1.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/self-gate-health.mjs
