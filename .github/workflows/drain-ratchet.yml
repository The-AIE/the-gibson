name: Drain ratchet
# Weekly backlog drain-rate sensor (#559). While config/drain-ratchet.v1.json says
# mode report-only, only the read-only `report` job runs: it writes the job summary,
# opens no issue and blocks no PR. The `open-issue` job, the only one with write
# scope on issues, runs only when the config says enforce.
# Fail-closed on bad data; no continue-on-error / || true / set +e.
on:
  schedule:
    - cron: "41 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drain-ratchet
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure drain rate and write the job summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/drain-ratchet.mjs --repo "$REPO" \
            --json-out "${RUNNER_TEMP}/drain-ratchet.json" --md-out "$GITHUB_STEP_SUMMARY"
      - name: Read the configured mode
        id: mode
        run: |
          set -euo pipefail
          mode=$(node -p 'require("./config/drain-ratchet.v1.json").mode')
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
  open-issue:
    needs: report
    if: needs.report.outputs.mode == 'enforce'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the single recovery issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/drain-ratchet.mjs --repo "$REPO" --open-issue
