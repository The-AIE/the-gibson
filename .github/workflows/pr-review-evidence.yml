name: PR review evidence

# Law 5 on the interactive path (#308). Every PR head needs an independent,
# authenticated review receipt before merge. This workflow ALWAYS executes
# trusted default-branch code — it never checks out or runs PR code — which is
# why it may use pull_request_target: it needs `statuses: write` on the base
# repository to publish the `review-evidence` commit status on PR heads.
# gibson:approved-pr-target 308
#
# Design (after four adversarial review rounds on #315): every run is a FULL
# STATE SWEEP. It stamps `pending` on every open PR head first, evaluates
# every open PR at its current head with trusted code, then ALWAYS publishes a
# final state for each. Consequences that closed real findings:
#   - a queued run that GitHub replaces is harmless: the next run re-derives
#     and republishes every head (no per-PR identity in the run);
#   - a PR that closes needs no special recovery: its former sibling is just
#     another open PR in the next sweep;
#   - a crash, cancel, or timeout can never leave a prior `success` standing:
#     the pending stamp landed first and the publish step runs on always().
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

# gibson:stateful-ci — runs are SERIALIZED repo-wide and never cancelled.
# The published result is keyed by commit SHA, but comment/review events carry
# no SHA, so runs cannot be grouped by head, and per-PR groups let two PRs
# sharing a head race (Codex round 3). One queue plus a full sweep means the
# last publish is always computed from the latest state. No cancel-in-progress:
# a cancelled run publishes nothing, and a skipped run would still cancel a
# live one (Codex round 1). GitHub may still REPLACE a queued run with a newer
# one (Codex round 4); the sweep makes that harmless.
concurrency:
  group: pr-review-evidence-serialized
  cancel-in-progress: false

jobs:
  review-evidence:
    name: Sweep review evidence (trusted base)
    # No job-level `if:` — deliberately. A run whose job is skipped still
    # REPLACES the one queued run in the concurrency group, so a comment on a
    # plain issue could displace a pending re-evaluation and then do nothing
    # (Codex round 5, finding 2). Every event runs the full sweep instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    env:
      GH_REPO: ${{ github.repository }}
      STATUS_CONTEXT: review-evidence
      TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The event's own PR and head, if the event carries them. Used only to
      # (a) stamp pending when the open-PR listing fails and (b) make the job
      # red when THIS event's PR fails, so the check is visible on that PR.
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted default branch (never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }

      - name: Stamp pending on every open PR head (FIRST)
        id: heads
        # continue-on-error so a listing failure still reaches the publish step,
        # which then fails closed on whatever head it knows (CONVENTIONS 3.5).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > heads.txt
          listed=0
          if gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
              --jq '.[] | "\(.number) \(.head.sha)"' > heads.txt; then
            listed=1
          else
            : > heads.txt
            echo "::notice::could not list open pull requests; publish will fail closed on the event head"
            echo "- open-PR listing failed; falling back to the event head" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The event's own head ALWAYS joins the set (Codex round 5, finding
          # 3): a PR (re)opened between this listing and the sweep, or omitted
          # by a stale listing, must still be stamped pending now.
          if [[ "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && ! grep -q " $EVENT_HEAD_SHA\$" heads.txt; then
            printf '%s %s\n' "${EVENT_PR_NUMBER:-0}" "$EVENT_HEAD_SHA" >> heads.txt
          fi
          stamped=0
          while read -r n sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            gh api --method POST "repos/$GH_REPO/statuses/$sha" \
              -f state="pending" -f context="$STATUS_CONTEXT" \
              -f description="IN PROGRESS: re-evaluating review evidence for PR $n" \
              -f target_url="$TARGET_URL" >/dev/null
            stamped=$((stamped + 1))
          done < heads.txt
          echo "pending stamped on $stamped open PR head(s)"
          [ "$listed" -eq 1 ] || exit 1

      - name: Evaluate every open PR at its current head (sweep)
        id: sweep
        if: always()
        # continue-on-error so the publish step always runs; a nonzero exit is
        # announced here and published as failure, never turned into a green.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node scripts/pr-review-evidence.mjs --repo "$GH_REPO" --sweep \
            --config config/review-evidence.v1.json > results.jsonl
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::notice::review-evidence sweep exited $rc; the published statuses carry the verdicts"
            echo "- review-evidence sweep exited $rc (see published statuses)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Publish every head (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -uo pipefail
          publish() { # sha state description
            gh api --method POST "repos/$GH_REPO/statuses/$1" \
              -f state="$2" -f context="$STATUS_CONTEXT" \
              -f description="${3:0:140}" -f target_url="$TARGET_URL" >/dev/null
          }
          event_fail=0
          # The sweep never ran or produced nothing: fail closed on every head we
          # stamped (or the event head). A cancellation is not a verdict: pending.
          if [ ! -s results.jsonl ] || ! grep -qE '"number":[0-9]+' results.jsonl; then
            state=failure; desc="api-error: sweep produced no verdicts"
            if [ "${CANCELLED}" = "true" ]; then state=pending; desc="SUPERSEDED: cancelled before a verdict"; fi
            n_pub=0
            while read -r n sha; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
              publish "$sha" "$state" "$desc"; n_pub=$((n_pub + 1))
              echo "### review-evidence: \`$state\` on PR $n — $desc" >> "$GITHUB_STEP_SUMMARY"
            done < heads.txt
            if [ "$n_pub" -eq 0 ]; then
              echo "::error::review-evidence: no verdicts and no known heads; a prior status may be stale until the next event"
              echo "### review-evidence: NOT PUBLISHED — no verdicts and no known heads" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # shellcheck disable=SC2016  # the $ is a JS regex anchor inside the node program
            parsed=$(printf '%s' "$line" | node -e '
              let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => {
                try {
                  const r = JSON.parse(s);
                  const st = ["success", "pending", "failure"].includes(r.state) ? r.state : "failure";
                  const sha = /^[0-9a-f]{40}$/.test(String(r.headSha || "")) ? r.headSha : "";
                  // Unit separator, not tab: bash `read` collapses empty tab-separated fields.
                  process.stdout.write([r.number ?? "", sha, st, String(r.description || r.reason || "api-error").replace(/[\r\n\t\x1f]+/g, " ")].join("\x1f"));
                } catch { process.stdout.write("\x1f\x1ffailure\x1fapi-error: unparseable sweep line"); }
              });')
            IFS=$'\x1f' read -r n sha state desc <<< "$parsed"
            if [ -z "$sha" ]; then
              echo "::error::sweep line without a head SHA: $desc"
              echo "- sweep line without a head SHA: $desc" >> "$GITHUB_STEP_SUMMARY"
              event_fail=1; continue
            fi
            if [ "${CANCELLED}" = "true" ]; then state=pending; desc="SUPERSEDED: cancelled before a verdict"; fi
            publish "$sha" "$state" "$desc"
            echo "- PR $n @ ${sha:0:7}: \`$state\` — $desc" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${EVENT_PR_NUMBER:-}" ] && [ "$n" = "$EVENT_PR_NUMBER" ] && [ "$state" = "failure" ]; then event_fail=1; fi
            echo "$sha" >> published.txt
          done < results.jsonl
          # Every head we stamped pending must have received a verdict; a head
          # the sweep did not cover (listing skew, a PR closed mid-run) must not
          # be left pending-or-stale — fail it closed (Codex round 5, finding 3).
          touch published.txt
          while read -r n sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            if ! grep -q "^$sha\$" published.txt; then
              publish "$sha" "failure" "api-error: sweep produced no verdict for this head"
              echo "- PR $n @ ${sha:0:7}: \`failure\` — no verdict from the sweep" >> "$GITHUB_STEP_SUMMARY"
              if [ -n "${EVENT_PR_NUMBER:-}" ] && [ "$n" = "$EVENT_PR_NUMBER" ]; then event_fail=1; fi
            fi
          done < heads.txt
          if [ "$event_fail" -eq 1 ]; then
            echo "::error::review-evidence: this event's pull request failed closed (see published status)"
            exit 1
          fi
