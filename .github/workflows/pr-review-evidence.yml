name: PR review evidence

# Law 5 on the interactive path (#308). Every PR head needs an independent,
# authenticated review receipt before merge. This workflow ALWAYS executes
# trusted default-branch code — it never checks out or runs PR code — which is
# why it may use pull_request_target: it needs `statuses: write` on the base
# repository to publish the `review-evidence` commit status on the PR head.
# gibson:approved-pr-target 308
#
# Publish sequence (conference-os #1458 class — the fail-open window is the
# whole point): resolve head via API → POST `pending` on that head FIRST →
# evaluate with trusted code → ALWAYS publish a final state, so a crash,
# cancel, or timeout can never leave a prior `success` standing.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

concurrency:
  # Each run re-evaluates the FULL current PR state, so a superseded run's
  # result is subsumed by the next one on the same PR; cancelling loses nothing.
  group: pr-review-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: Evaluate review evidence (trusted base)
    # Narrowed to events that can change the verdict:
    # - pull_request_target: unconditional (a body edit can add/remove an
    #   attestation-relevant reference; a synchronize moves the head).
    # - pull_request_review: only a Bot-type reviewer can ever be evidence.
    # - issue_comment: only on PRs; `created` is marker-gated, `edited` and
    #   `deleted` are unconditional because a receipt can be retracted or
    #   corrupted by editing/deleting it, which must re-evaluate.
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type == 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.action == 'deleted' ||
        github.event.action == 'edited' ||
        contains(github.event.comment.body, 'review-evidence:v1') ||
        contains(github.event.comment.body, 'owner-review-attestation:v1')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    env:
      GH_REPO: ${{ github.repository }}
      STATUS_CONTEXT: review-evidence
    steps:
      - name: Resolve current pull-request head (API, not the event payload)
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::event did not identify a pull request"
            exit 1
          fi
          head_sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve a 40-hex head for PR #$PR_NUMBER"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Invalidate prior exact-head status (pending FIRST)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="pending" \
            -f context="$STATUS_CONTEXT" \
            -f description="IN PROGRESS: re-evaluating review evidence for current head" \
            -f target_url="$TARGET_URL" >/dev/null

      - name: Checkout trusted default branch (never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }

      - name: Evaluate current-head review evidence
        id: evidence
        # continue-on-error so the publish step below always runs; a failure
        # here is surfaced as a visible notice AND as the published status —
        # it is never converted into a green (CONVENTIONS 3.5).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
        run: |
          set -uo pipefail
          node scripts/pr-review-evidence.mjs \
            --repo "$GH_REPO" \
            --pr "$PR_NUMBER" \
            --expected-head "$HEAD_SHA" \
            --config config/review-evidence.v1.json \
            --github-output "$GITHUB_OUTPUT"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::notice::review-evidence evaluator exited $rc; the published status carries the verdict"
            echo "- review-evidence evaluator exited $rc (see published status)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Publish exact-head status (always)
        if: always() && steps.pull.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          STATE: ${{ steps.evidence.outputs.state }}
          REASON: ${{ steps.evidence.outputs.reason }}
          DESCRIPTION: ${{ steps.evidence.outputs.description }}
          CANCELLED: ${{ job.status == 'cancelled' }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Cancellation is not a verdict: stamp pending (blocks merge, no red).
          # Anything else without a state means the evaluator crashed before
          # writing outputs: publish failure, never leave a prior success.
          case "${CANCELLED}:${STATE}" in
            true:*)      state=pending; desc="SUPERSEDED: cancelled before a verdict" ;;
            *:success)   state=success; desc="${DESCRIPTION:-pass}" ;;
            *:pending)   state=pending; desc="UNREVIEWED: ${DESCRIPTION:-no receipt at head}" ;;
            *:failure)   state=failure; desc="${DESCRIPTION:-failure}" ;;
            *)           state=failure; desc="api-error: evaluator-crashed (no verdict written)" ;;
          esac
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="${desc:0:140}" \
            -f target_url="$TARGET_URL" >/dev/null
          {
            echo "### review-evidence: \`$state\` — ${REASON:-$state}"
            echo
            echo "$desc"
            if [ "$state" != "success" ]; then
              echo
              echo "This head may not be merged. A pending status blocks merge exactly like a failure; only success authorizes a merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact-head review evidence
        if: steps.evidence.outcome == 'failure' && steps.evidence.outputs.state != 'pending'
        env:
          DESCRIPTION: ${{ steps.evidence.outputs.description || 'review evidence evaluation failed closed' }}
        run: |
          echo "::error::$DESCRIPTION"
          exit 1
