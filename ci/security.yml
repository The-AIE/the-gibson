# gibson-template-version: sha256:52862725d1c8b11a693e6a955da7270aefb01fb71c157687134f3c36147c1a70
# The Gibson — security layers 2, 3 (partial), 4, 5, 8 (+ nightly full DAST)
# Install as .github/workflows/security.yml in the target repo (docs/13, docs/08).
# Calibrate: fill <angle> placeholders; preview URL resolution needs Vercel GitHub
# integration or secrets.VERCEL_TOKEN.
#
# 2026-08: Semgrep (Layer 2 SAST) + Trivy (Layer 3 / fs SCA) added as report-only
# (continue-on-error) so adopters can baseline without breaking green gates.
# Promote to hard-fail after triage — same path ConferenceOS #1074 is taking.
# Layers 1 (gitleaks) and remaining Layer 3 (npm audit / OSV) usually live in the
# target's gibson-gate.yml or security-gate workflow.

name: gibson-security
on:
  pull_request:
  schedule:
    # Nightly full DAST vs staging (never active-scan production)
    - cron: "0 6 * * *"
  workflow_dispatch:

# Deny all by default. Jobs grant least privilege only.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only. Nightly/manual DAST must run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Layer 2 — SAST (Semgrep). Report-only until target has a clean board.
  sast-semgrep:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Report-only until promoted: job-level so the SHA-pinned uses: step can
    # fail without a comment-only ::warning:: gaming the visible-skip sensor.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Semgrep SAST (report)
        id: semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/typescript
            p/nextjs
            p/react
            p/security-audit
            p/secrets
            p/owasp-top-ten
      # L-056: report-only must stay visible. Trailing if: always() so a
      # checkout/action failure is not hidden; steps.semgrep.outcome
      # distinguishes success from failure/skipped. Job stays continue-on-error.
      - name: Report Semgrep outcome
        if: always()
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          outcome="${SEMGREP_OUTCOME:-unknown}"
          case "$outcome" in
            success)
              msg="Semgrep SAST is report-only (job continue-on-error); scan completed — findings do not fail the gate until promoted to hard-fail"
              echo "::notice::${msg}"
              ;;
            failure)
              msg="Semgrep SAST is report-only (job continue-on-error); scan failed — findings do not fail the gate until promoted to hard-fail"
              echo "::warning::${msg}"
              ;;
            skipped)
              msg="Semgrep SAST is report-only (job continue-on-error); scan skipped (prior step or action did not run)"
              echo "::warning::${msg}"
              ;;
            *)
              msg="Semgrep SAST is report-only (job continue-on-error); unexpected outcome=${outcome}"
              echo "::warning::${msg}"
              ;;
          esac
          echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"

  # Layer 3 (partial) — Trivy filesystem / supply-chain complementary scan.
  trivy-fs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Announce Trivy report-only (L-056)
        run: |
          msg="Trivy filesystem scan is report-only (exit-code 0); findings do not fail the gate until promoted to hard-fail"
          echo "::warning::${msg}"
          echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  # Layer 4 — AuthZ matrix: new routes must appear in the inventory
  authz-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Generate route inventory
        run: |
          # Copy Gibson script into path or vendor it at adoption:
          # node .gibson/scripts/route-inventory.mjs --root . --out /tmp/routes.json
          if [ -f scripts/route-inventory.mjs ]; then
            node scripts/route-inventory.mjs --root . --out /tmp/routes-now.json
          elif [ -f .gibson/scripts/route-inventory.mjs ]; then
            node .gibson/scripts/route-inventory.mjs --root . --out /tmp/routes-now.json
          else
            msg="route-inventory.mjs not installed — skip structural check (adoption gap)"
            echo "::warning::${msg}"
            echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
      - name: Fail if matrix missing for discovered routes
        run: |
          # Expected committed matrix at tests/authz/route-matrix.json (adoption)
          if [ ! -f tests/authz/route-matrix.json ]; then
            msg="No tests/authz/route-matrix.json yet — report-only until burn-down (authz matrix skip)"
            echo "::warning::${msg}"
            echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const now=require("/tmp/routes-now.json");
            const mat=require("./tests/authz/route-matrix.json");
            const known=new Set((mat.routes||[]).map(r=>r.path+"|"+r.kind));
            const missing=(now.routes||[]).filter(r=>!known.has(r.path+"|"+r.kind));
            if(missing.length){
              console.error("Routes missing from authz matrix:");
              for(const m of missing) console.error(" -", m.kind, m.path, m.file);
              process.exit(1);
            }
            const unfilled=(mat.routes||[]).filter(r=>r.expect && Object.values(r.expect).some(v=>v==null));
            if(unfilled.length){
              console.error("Matrix entries with null expect (fill or mark n/a):", unfilled.length);
              process.exit(1);
            }
            console.log("authz matrix OK");
          '

  # Layer 5 — ZAP baseline vs. preview (PR only)
  zap-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve preview URL
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -e
          echo "::add-mask::${VERCEL_AUTOMATION_BYPASS_SECRET:-__unset__}"
          if [ ! -x scripts/preview-url.sh ]; then
            echo "::error::scripts/preview-url.sh is not vendored — DAST cannot run and a skipped DAST is not a pass (docs/08)."
            exit 1
          fi
          bypass=""
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then bypass="--bypass"; fi
          # No preview means no DAST result. A missing result is not a green
          # gate — the old skip=1 path let two Tier-B PRs merge with ZAP,
          # posture, and UX all silently unrun (L-012).
          if ! url=$(./scripts/preview-url.sh "${{ github.event.pull_request.number }}" --timeout 300 --probe $bypass 2>err.txt); then
            echo "::error::No usable preview — ZAP baseline did not run, so this check is a MISSING RESULT, not a pass. $(cat err.txt)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"
      - name: ZAP baseline scan
        if: steps.preview.outputs.skip != '1'
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ steps.preview.outputs.url }}
          # fail_action true = hard-fail on high+ (docs/08)
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"

  # Layer 8 — posture probe vs. preview
  posture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve preview + probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -e
          echo "::add-mask::${VERCEL_AUTOMATION_BYPASS_SECRET:-__unset__}"
          if [ ! -x scripts/posture-probe.sh ]; then
            msg="posture-probe.sh not vendored — skip (adoption gap)"
            echo "::warning::${msg}"
            echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bypass=""
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then bypass="--bypass"; fi
          if ! url=$(./scripts/preview-url.sh "${{ github.event.pull_request.number }}" --timeout 300 --probe $bypass 2>err.txt); then
            echo "::error::No usable preview — posture probe did not run (missing result, not a pass; L-012). $(cat err.txt)"
            exit 1
          fi
          ./scripts/posture-probe.sh "$url" --no-burst

  # Nightly full DAST vs staging only
  zap-full-staging:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Full scan against staging
        uses: zaproxy/action-full-scan@d2a07475d467566c9a3e3c700f31f47724aa1060 # v0.10.0
        with:
          # Set repo variable STAGING_URL — never production
          target: ${{ vars.STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
        # Require STAGING_URL configured; otherwise the job should be disabled at adoption
