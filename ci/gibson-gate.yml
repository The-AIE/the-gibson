# The Gibson — green gate workflow (template)
# Install as .github/workflows/gibson-gate.yml in the target repo (docs/13).
# Fill <angle> placeholders from the repo's gate commands. This is the CI half of
# docs/06 — the law that holds no matter which runtime wrote the code.

name: gibson-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the claim sensor below diffs the merge base against
      # HEAD. Under the default shallow checkout the base ref is unreachable and
      # the sensor fails the job rather than silently passing (issue #55).
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --include=dev

      # Claim isolation: PRs may not edit another session's claim row
      - name: Fetch the PR base branch
        if: github.event_name == 'pull_request'
        # Via env, not ${{ }} inside the script: a branch name is attacker-controlled
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --prune origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - run: node scripts/check-active-work.mjs
        if: github.event_name == 'pull_request'

      - run: <generate>      # e.g. npx prisma generate
      - run: <typecheck>     # e.g. npx tsc --noEmit
      - run: <lint>          # e.g. npm run lint
      - run: <test>          # e.g. npx vitest run
      - run: <build>         # e.g. npm run build

  # Layers 1–3 of docs/08 (hard-fail). Extend with authz/DAST/ux-eval jobs per
  # ci/README.md as adoption matures.
  security-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: SAST (semgrep)
        run: pipx run semgrep ci --config p/owasp-top-ten --config p/secrets
      - name: Supply chain
        run: npm audit --audit-level=critical
